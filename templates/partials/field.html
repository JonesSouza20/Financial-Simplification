<div class="field">
  {% if field.widget_type == 'checkbox' %}
    <label class="flex items-center gap-2 text-sm text-text">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
</div>
