{% extends "base.html" %}{% load fin %}
{% block title %}Mais{% endblock %}
{% block content %}
<div class="flex flex-col gap-4 max-w-md">
  <h1>Mais</h1>
  <nav class="card flex flex-col" aria-label="Todas as seções">
    {% for name, label, ic, active in nav_holdings %}<a href="{% url name %}" class="row">{{ label }}</a>{% endfor %}
    <a href="{% url 'ui:settings' %}" class="row">Ajustes</a>
  </nav>
  <form method="post" action="{% url 'security:logout' %}">{% csrf_token %}
    <button class="btn btn-secondary" type="submit">Sair</button>
  </form>
</div>
{% endblock %}
