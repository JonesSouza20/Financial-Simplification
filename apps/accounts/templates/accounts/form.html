{% extends "base.html" %}
{% block title %}Nova conta{% endblock %}
{% block content %}
<div class="max-w-md flex flex-col gap-4">
  <h1>Nova conta</h1>
  <form method="post" class="card flex flex-col gap-4">{% csrf_token %}
    {% include "partials/form_errors.html" %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-primary" type="submit">Criar conta</button>
  </form>
</div>
{% endblock %}
