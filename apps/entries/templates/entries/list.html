{% extends "base.html" %}
{% block title %}Movimentações{% endblock %}
{% block content %}
<div class="flex items-baseline justify-between gap-3 flex-wrap"><h1>Movimentações</h1><a class="btn btn-secondary" href="{% url 'entries:new' %}">Novo lançamento</a></div>
<details class="mt-2 border-b border-border" {% if request.GET %}open{% endif %}>
  <summary class="link cursor-pointer min-h-11 flex items-center">Filtros</summary>
  <form class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4 pb-3" method="get"
        hx-get="{% url 'entries:list' %}" hx-target="#rows" hx-trigger="change, submit" hx-push-url="true">
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <div class="flex items-end"><button class="btn btn-secondary w-full" type="submit">Filtrar</button></div>
  </form>
</details>
<div id="rows">{% include "entries/_rows.html" %}</div>
{% endblock %}
